<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>관리자 | 네모맨 · 공간F5</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  body{background:var(--bg)}
  .adm-wrap{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
  .adm-top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  .adm-top h1{font-size:1.4rem;font-weight:900;letter-spacing:-.02em}
  .adm-top .count{color:var(--ink-2);font-weight:700;font-size:.92rem}
  .adm-top .sp{margin-left:auto}

  /* 로그인 */
  .login{max-width:360px;margin:12vh auto 0;background:#fff;border:1px solid var(--line);
    border-radius:18px;padding:32px;box-shadow:var(--shadow-md);text-align:center}
  .login h2{font-size:1.2rem;font-weight:900;margin-bottom:6px}
  .login p{color:var(--ink-2);font-size:.9rem;margin-bottom:20px}
  .login input{width:100%;padding:13px 14px;border:1.6px solid var(--line);border-radius:12px;
    font-family:inherit;font-size:1rem;margin-bottom:12px}
  .login input:focus{outline:none;border-color:var(--blue)}
  .login .err{color:#E5484D;font-size:.85rem;font-weight:700;margin-bottom:12px;display:none}

  /* 테이블 */
  .table-box{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:var(--shadow-sm)}
  .table-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.88rem;white-space:nowrap}
  th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--blue-050);color:var(--ink);font-weight:800;font-size:.82rem;position:sticky;top:0}
  tbody tr:hover{background:var(--blue-050)}
  td .amt{color:var(--blue);font-weight:800}
  td.wrap{white-space:normal;min-width:180px;color:var(--ink-2)}
  .badge{display:inline-block;background:var(--blue-050);color:var(--blue);border:1px solid var(--blue-100);
    border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:700}
  .empty{padding:60px 20px;text-align:center;color:var(--ink-3);font-weight:600}
  .hidden{display:none}

  /* 탭 */
  .tabs{display:flex;gap:6px;padding:5px;background:#fff;border:1px solid var(--line);border-radius:14px;
    margin-bottom:18px;width:max-content;max-width:100%}
  .tab{padding:9px 18px;border-radius:10px;font-weight:800;font-size:.92rem;color:var(--ink-2)}
  .tab.active{background:var(--blue);color:#fff;box-shadow:var(--shadow-sm)}

  /* 상담 신청 · 사진 */
  .kind{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:800;border:1px solid transparent}
  .kind-bath{background:var(--blue-050);color:var(--blue);border-color:var(--blue-100)}
  .kind-demo{background:#FFF4D6;color:#8A5A00;border-color:#FCE39A}
  .kind-etc{background:#EEF0F3;color:var(--ink-2);border-color:var(--line)}
  .photos{display:flex;gap:6px;flex-wrap:wrap;min-width:120px}
  .photos a{display:block;width:56px;height:56px;border-radius:8px;overflow:hidden;background:var(--blue-050);
    border:1px solid var(--line)}
  .photos img{width:100%;height:100%;object-fit:cover;display:block}
</style>
</head>
<body>

<!-- 로그인 -->
<div class="login" id="login">
  <h2>견적 관리자</h2>
  <p>비밀번호를 입력하세요.</p>
  <input type="password" id="pw" placeholder="관리자 비밀번호" autocomplete="current-password">
  <div class="err" id="loginErr">비밀번호가 올바르지 않습니다.</div>
  <button class="btn btn-primary btn-block" id="loginBtn">로그인</button>
</div>

<!-- 관리자 화면 -->
<div class="adm-wrap hidden" id="app">
  <div class="adm-top">
    <h1 id="title">견적 신청 목록</h1>
    <span class="count" id="count"></span>
    <span class="sp"></span>
    <button class="btn btn-ghost" id="reloadBtn">새로고침</button>
    <button class="btn btn-ghost" id="logoutBtn">로그아웃</button>
  </div>

  <!-- 탭: 철거 견적 / 상담 신청 -->
  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="est" role="tab">철거 견적</button>
    <button class="tab" data-tab="consult" role="tab">상담 신청</button>
  </div>

  <!-- 철거 견적 (기존) -->
  <div class="table-box" id="estBox">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>접수일시</th><th>이름</th><th>연락처</th><th>지역</th>
            <th>건물</th><th>업종</th><th>평수</th><th>범위</th>
            <th>예상견적</th><th>인테리어</th><th>희망일</th><th>요청사항</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty hidden" id="empty">아직 접수된 견적이 없습니다.</div>
  </div>

  <!-- 상담 신청 (consult.html) -->
  <div class="table-box hidden" id="consultBox">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>접수일시</th><th>종류</th><th>이름</th><th>연락처</th><th>지역</th>
            <th>범위</th><th>메모</th><th>유입</th><th>사진</th>
          </tr>
        </thead>
        <tbody id="consultRows"></tbody>
      </table>
    </div>
    <div class="empty hidden" id="consultEmpty">아직 접수된 상담이 없습니다.</div>
  </div>
</div>

<script>
  const TYPE = { store:'상가/점포', office:'사무실', factory:'공장', house:'주택' };
  const CAT  = { food:'음식점', retail:'소매점', service:'서비스업', office:'사무실', other:'기타' };
  const SCOPE= { partial:'부분', full:'전체' };
  const INT  = { yes:'계획있음', no:'철거만', maybe:'고민중' };
  const KIND = { bath:'욕실·화장실', demo:'점포·상가 철거', etc:'기타 인테리어' };

  const $ = id => document.getElementById(id);
  const KEY = 'nm_admin_auth';
  const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function authHeader(){ return sessionStorage.getItem(KEY); }

  let tab = 'est'; // est | consult

  async function load(){
    const auth = authHeader();
    if(!auth){ showLogin(); return; }
    const api = tab === 'consult' ? '/api/admin/consult' : '/api/admin/estimates';
    let res;
    try {
      res = await fetch(api, { headers: { Authorization: auth } });
    } catch { alert('서버에 연결할 수 없습니다.'); return; }
    if(res.status === 401){ sessionStorage.removeItem(KEY); showLogin(true); return; }
    const out = await res.json().catch(()=>({}));
    if(!res.ok || !out.ok){ alert(out.error || '조회 실패'); return; }
    if(tab === 'consult') renderConsult(out.rows || []);
    else render(out.rows || []);
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
  }

  function switchTab(next){
    tab = next;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === next));
    $('estBox').classList.toggle('hidden', next !== 'est');
    $('consultBox').classList.toggle('hidden', next !== 'consult');
    $('title').textContent = next === 'consult' ? '상담 신청 목록' : '견적 신청 목록';
    load();
  }

  function render(rows){
    $('count').textContent = '총 ' + rows.length + '건';
    $('empty').classList.toggle('hidden', rows.length > 0);
    $('rows').innerHTML = rows.map(r => {
      const dt = r.created_at ? new Date(r.created_at).toLocaleString('ko-KR', { hour12:false }) : '-';
      const amt = (r.est_min!=null) ? `<span class="amt">${Number(r.est_min).toLocaleString()}~${Number(r.est_max).toLocaleString()}만원</span>` : '-';
      const tel = r.phone ? `<a href="tel:${esc(r.phone).replace(/\D/g,'')}">${esc(r.phone)}</a>` : '-';
      return `<tr>
        <td>${esc(dt)}</td>
        <td><b>${esc(r.name)}</b></td>
        <td>${tel}</td>
        <td>${esc(r.region)}</td>
        <td>${esc(TYPE[r.building_type]||r.building_type||'-')}</td>
        <td>${esc(CAT[r.category]||r.category||'-')}</td>
        <td>${r.size!=null?esc(r.size)+'평':'-'}</td>
        <td>${esc(SCOPE[r.scope]||r.scope||'-')}</td>
        <td>${amt}</td>
        <td>${r.interior?`<span class="badge">${esc(INT[r.interior]||r.interior)}</span>`:'-'}</td>
        <td>${esc(r.wish_date||'-')}</td>
        <td class="wrap">${esc(r.memo||'')}</td>
      </tr>`;
    }).join('');
  }

  /* ---------- 상담 신청 표 ---------- */
  function renderConsult(rows){
    $('count').textContent = '총 ' + rows.length + '건';
    $('consultEmpty').classList.toggle('hidden', rows.length > 0);
    $('consultRows').innerHTML = rows.map(r => {
      const dt = r.created_at ? new Date(r.created_at).toLocaleString('ko-KR', { hour12:false }) : '-';
      const tel = r.phone ? `<a href="tel:${esc(r.phone).replace(/\D/g,'')}">${esc(r.phone)}</a>` : '-';
      const kind = r.kind ? `<span class="kind kind-${esc(r.kind)}">${esc(KIND[r.kind]||r.kind)}</span>` : '-';
      const photos = Array.isArray(r.photos) ? r.photos : [];
      const ph = photos.length
        ? `<div class="photos">${photos.map(k => `<a href="#" data-key="${esc(k)}" title="${esc(k)}"></a>`).join('')}</div>`
        : '-';
      return `<tr>
        <td>${esc(dt)}</td>
        <td>${kind}</td>
        <td><b>${esc(r.name||'-')}</b></td>
        <td>${tel}</td>
        <td>${esc(r.region)}</td>
        <td class="wrap">${esc(r.scope||'-')}</td>
        <td class="wrap">${esc(r.memo||'')}</td>
        <td>${esc(r.source||'-')}</td>
        <td>${ph}</td>
      </tr>`;
    }).join('');
    loadThumbs();
  }

  // <img src>는 Authorization 헤더를 못 보내므로 fetch → blob URL 로 표시
  const blobCache = new Map();
  async function fetchPhoto(key){
    if(blobCache.has(key)) return blobCache.get(key);
    const res = await fetch('/api/admin/photo/' + key.split('/').map(encodeURIComponent).join('/'),
      { headers: { Authorization: authHeader() } });
    if(!res.ok) throw new Error('photo ' + res.status);
    const url = URL.createObjectURL(await res.blob());
    blobCache.set(key, url);
    return url;
  }
  function loadThumbs(){
    document.querySelectorAll('#consultRows .photos a[data-key]').forEach(async a => {
      try {
        const url = await fetchPhoto(a.dataset.key);
        a.innerHTML = `<img src="${url}" alt="">`;
      } catch { a.textContent = '!'; }
    });
  }
  $('consultRows').addEventListener('click', async e => {
    const a = e.target.closest('a[data-key]');
    if(!a) return;
    e.preventDefault();
    try { window.open(await fetchPhoto(a.dataset.key), '_blank'); } catch { alert('사진을 불러올 수 없습니다.'); }
  });

  function showLogin(isErr){
    $('app').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('loginErr').style.display = isErr ? 'block' : 'none';
    $('pw').focus();
  }

  async function doLogin(){
    const pw = $('pw').value;
    if(!pw) return;
    const auth = 'Basic ' + btoa('admin:' + pw);
    const res = await fetch('/api/admin/estimates?limit=1', { headers: { Authorization: auth } }).catch(()=>null);
    if(res && res.ok){
      sessionStorage.setItem(KEY, auth);
      $('pw').value = '';
      load();
    } else {
      $('loginErr').style.display = 'block';
    }
  }

  $('loginBtn').addEventListener('click', doLogin);
  $('pw').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  $('reloadBtn').addEventListener('click', load);
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
  $('logoutBtn').addEventListener('click', () => { sessionStorage.removeItem(KEY); showLogin(); });

  // 세션에 인증정보가 있으면 바로 로드
  load();
</script>
</body>
</html>

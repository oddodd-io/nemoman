# Cloudflare Pages + Functions 설정
# 정적 사이트(루트)를 Pages로 배포하고, /functions/**를 서버리스 API로 실행합니다.
name = "nemoman"
compatibility_date = "2026-01-01"
pages_build_output_dir = "."

# D1 바인딩 (이 프로젝트는 바인딩을 wrangler.toml로 관리합니다)
# 코드에서 env.DB 로 접근. database_id 는 실제 nemoman-db 의 ID.
[[d1_databases]]
binding = "DB"
database_name = "nemoman-db"
database_id = "0f4bb34b-4e82-4b11-8b88-3caa3fc95ec2"

# 비밀값은 코드에 넣지 않고 대시보드에서 등록합니다.
#   Settings → Variables and secrets → Add (Type: Secret)
#     SOLAPI_API_KEY / SOLAPI_API_SECRET / OWNER_PHONE / SENDER_PHONE / ADMIN_PASSWORD
#     (선택) TURNSTILE_SECRET

# Cloudflare Pages + Functions 설정
# 정적 사이트(루트)를 Pages로 배포하고, /functions/**를 서버리스 API로 실행합니다.
name = "nemoman"
compatibility_date = "2026-01-01"
pages_build_output_dir = "."

# D1과 비밀값은 코드/설정에 넣지 않고 "대시보드"에서 연결합니다.
#
# 1) D1 바인딩
#    Pages → 프로젝트(nemoman) → Settings → Functions → D1 database bindings
#      · Variable name : DB
#      · D1 database    : nemoman-db  (먼저 Storage & databases → D1 에서 생성)
#
# 2) 비밀값 (Settings → Environment variables → Add, "Encrypt" 체크)
#      SOLAPI_API_KEY / SOLAPI_API_SECRET / OWNER_PHONE / SENDER_PHONE / ADMIN_PASSWORD
#      (선택) TURNSTILE_SECRET
#
# 위 항목은 코드에서 env.DB / env.ADMIN_PASSWORD 처럼 자동 주입됩니다.
